<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Calendar</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH" crossorigin="anonymous">
    <script src="calendar.js" defer></script>
</head>

<body>
 
  <nav class="navbar navbar-expand-lg bg-body-tertiary">
      <div class="container-fluid">
        <a class="navbar-brand" href="#">Navbar</a>
        <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarSupportedContent" aria-controls="navbarSupportedContent" aria-expanded="false" aria-label="Toggle navigation">
          <span class="navbar-toggler-icon"></span>
        </button>
        <div class="collapse navbar-collapse" id="navbarSupportedContent">
          <ul class="navbar-nav me-auto mb-2 mb-lg-0">
            <li class="nav-item">
              <a class="nav-link active" aria-current="page" href="#">Home</a>
            </li>
            <li class="nav-item">
              <a class="nav-link" href="#">About</a>
            <li class="nav-item">
              <a class="nav-link disabled" aria-disabled="true">Disabled</a>
            </li>
          </ul>
          </form>
        </div>
      </div>
  </nav>

  <div class="container text-center my-4">
    <div class="d-flex justify-content-between align-items-center mb-3">
      <button class="btn btn-secondary" onclick="leftButtonClick()">Previous</button>
      <h2 id="current-month">October 2024</h2>
      <button class="btn btn-secondary" onclick="rightButtonClick()">Next</button>
    </div>
  </div>
  <div class="container text-center">
    <div class="row">
      <div class="col">Sun</div>
      <div class="col">Mon</div>
      <div class="col">Tue</div>
      <div class="col">Wed</div>
      <div class="col">Thu</div>
      <div class="col">Fri</div>
      <div class="col">Sat</div>
    </div>
  </div>

  <div class="container my-3">
    <div class="row g-2" id="calendar-grid">

      <div class="col" id="date-0-0">
        <div class="card">
          <div class="card-body">
            <h5 class="card-title">...</h5>
            <p class="card-text">- No events -</p>
          </div>
        </div>
      </div>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js" integrity="sha384-YvpcrYf0tY3lHB60NNkmXc5s9fDVZLESaAA55NDzOxhy9GkcIdslK1eN7N6jIeHz" crossorigin="anonymous"></script>

  <script>
    document.addEventListener('DOMContentLoaded', () => {
      const currentMonthElement= document.getElementById('current-month');
      const monthName= displayMonth();
      const year =new Date().getFullYear();
      currentMonthElement.textContent = `${monthName} ${year}`;
    });

    document.addEventListener('DOMContentLoaded', () => {
      const calendarGrid = document.getElementById('calendar-grid');
      for (let week = 0; week < 6; week++) {
        for (let day = 0; day < 7; day++) {
          const cell = document.createElement('div');
          cell.className = 'col';
          cell.id = `date-${week}-${day}`;
          cell.innerHTML = `
                      <div class="card">
                          <div class="card-body">
                              <h5 class="card-title">...</h5>
                              <p class="card-text">- No events -</p>
                          </div>
                      </div>
                  `;
          calendarGrid.appendChild(cell);
        }
      }
    });
  </script>
</body>
</html>
